apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/digitalocean/csi-digitalocean/master/deploy/kubernetes/releases/csi-digitalocean-v4.12.0/crds.yaml
  - https://raw.githubusercontent.com/digitalocean/csi-digitalocean/master/deploy/kubernetes/releases/csi-digitalocean-v4.12.0/driver.yaml
  - https://raw.githubusercontent.com/digitalocean/csi-digitalocean/master/deploy/kubernetes/releases/csi-digitalocean-v4.12.0/snapshot-controller.yaml

patches:
  - patch: |
      - op: remove
        path: /spec/template/spec/initContainers
    target:
      kind: DaemonSet
      name: csi-do-node
