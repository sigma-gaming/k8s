apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cloudflare-tls-mirror
  namespace: cloudflare-tls
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/secret-mirror
      version: "1.0.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    nameTemplate: "%s-cloudflare-tls"
    targets:
      - namespace: oauth2-proxy
        secrets:
          - sigmacloud.app
      - namespace: monitoring
        secrets:
          - sigmacloud.app
      - namespace: games-production
        secrets:
          - sigma1.games
          - letsauth.app
          - sigm.to
          - sigmacloud.app
