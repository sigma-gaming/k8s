apiVersion: v1
kind: Namespace
metadata:
  name: registry-creds
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: google-registry-creds
  namespace: default
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: google-registry-creds
      namespace: default
    type: kubernetes.io/dockerconfigjson
---
apiVersion: ops.alexellis.io/v1
kind: ClusterPullSecret
metadata:
  name: google-registry-creds
spec:
  secretRef:
    name: google-registry-creds
    namespace: registry-creds
