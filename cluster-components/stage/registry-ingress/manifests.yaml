apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: harbor
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - registry.sigmacloud.app
      secretName: registry.sigmacloud.app-cert
  rules:
    - host: registry.sigmacloud.app
      http:
        paths:
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: harbor-registry
                port:
                  number: 80
