
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stackgres-ui
  namespace: stackgres
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    nginx.ingress.kubernetes.io/auth-url: https://auth.sigmacloud.app/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://auth.sigmacloud.app/oauth2/start?rd=$scheme://$host$request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Authorization

    # Set x-forwarded headers for redirect
    nginx.ingress.kubernetes.io/auth-snippet: |
      auth_request_set $x_forwarded_proto $scheme;
      auth_request_set $x_forwarded_uri $request_uri;
      auth_request_set $x_forwarded_host $host;
    
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stackgres.sigmacloud.app
      secretName: stackgres.sigmacloud.app-cert
  rules:
    - host: stackgres.sigmacloud.app
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: stackgres-restapi
                port:
                  number: 80
