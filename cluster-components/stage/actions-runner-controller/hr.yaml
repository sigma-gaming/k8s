apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  interval: 1m
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-controller
  namespace: arc-system
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.9.3"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
      interval: 10m
  values:
    nodeSelector:
      role: ci-cd
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "ci-cd"
        effect: "NoSchedule"