apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: netdata
  namespace: flux-system
spec:
  interval: 1m
  url: https://netdata.github.io/helmchart
---
apiVersion: v1
kind: Namespace
metadata:
  name: netdata
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: netdata
  namespace: netdata
spec:
  encryptedData:
    NETDATA_CLAIM_ROOMS: 
    NETDATA_CLAIM_TOKEN: 
  template:
    metadata:
      name: netdata
      namespace: netdata
    type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
  namespace: netdata
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: netdata
      version: '3.7.106'
      sourceRef:
        kind: HelmRepository
        name: netdata
        namespace: flux-system
      interval: 10m
  values:
    image:
      tag: stable

    restarter:
      enabled: true

    parent:
      claiming:
        enabled: true
      envFrom:
        - secretRef:
            name: netdata

    child:
      claiming:
        enabled: true
      envFrom:
        - secretRef:
            name: netdata
