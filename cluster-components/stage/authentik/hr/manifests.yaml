apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1m
  url: https://charts.goauthentik.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: '2024.6.0'
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 10m
  values:
    server:
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-db-primary.authentik
        - name: AUTHENTIK_POSTGRESQL__DATABASE
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: postgres
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db
              key: superuser-password
      envFrom:
        - secretRef:
            name: authentik-env
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: selfsigned
        hosts:
          - authentik.sigmacloud.app
        tls:
          - hosts:
              - authentik.sigmacloud.app
            secretName: authentik.sigmacloud.app-cert
    
    worker:
      env:
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: authentik-db-primary.authentik
        - name: AUTHENTIK_POSTGRESQL__DATABASE
          value: authentik
        - name: AUTHENTIK_POSTGRESQL__USER
          value: postgres
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db
              key: superuser-password
      envFrom:
        - secretRef:
            name: authentik-env

    redis:
      enabled: true