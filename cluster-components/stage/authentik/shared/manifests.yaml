apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-env
  namespace: authentik
spec:
  encryptedData:
    AUTHENTIK_SECRET_KEY: 
    AUTHENTIK_BOOTSTRAP_EMAIL: 
    AUTHENTIK_BOOTSTRAP_TOKEN: 
    AUTHENTIK_BOOTSTRAP_PASSWORD: 
  template:
    metadata:
      name: authentik-env
      namespace: authentik
    type: Opaque
---
apiVersion: stackgres.io/v1
kind: SGInstanceProfile
metadata:
  name: size-xs
  namespace: authentik
spec:
  cpu: 100m
  memory: 128Mi