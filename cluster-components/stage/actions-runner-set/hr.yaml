apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: arc-charts
  namespace: flux-system
spec:
  interval: 1m
  type: oci
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-secret
  namespace: arc-runners
spec:
  encryptedData:
    github_app_id: 
    github_app_installation_id: 
    github_app_private_key: 
  template:
    metadata:
      name: github-secret
      namespace: arc-runners
    type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.9.3"
      sourceRef:
        kind: HelmRepository
        name: arc-charts
        namespace: flux-system
      interval: 10m
  values:
    nodeSelector:
      role: ci-cd
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "ci-cd"
        effect: "NoSchedule"
    githubConfigUrl: https://github.com/sigma-gaming
    githubConfigSecret: github-secret

    template:
      spec:
        initContainers:
        - name: init-dind-externals
          image: ghcr.io/actions/actions-runner:latest
          command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
          volumeMounts:
            - name: dind-externals
              mountPath: /home/runner/tmpDir
        containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/home/runner/run.sh"]
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
        - name: dind
          image: docker:dind
          args:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --group=$(DOCKER_GROUP_GID)
          env:
            - name: DOCKER_GROUP_GID
              value: "123"
          securityContext:
            privileged: true
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
            - name: dind-externals
              mountPath: /home/runner/externals
            - name: workspace
              mountPath: /home/runner/workspace
        volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
        - name: dind-externals
          emptyDir: {}
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace
