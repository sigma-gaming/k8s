apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: arc-charts
  namespace: flux-system
spec:
  interval: 1m
  type: oci
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-secret
  namespace: arc-runners
spec:
  encryptedData:
    github_app_id: 
    github_app_installation_id: 
    github_app_private_key: 
  template:
    metadata:
      name: github-secret
      namespace: arc-runners
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-secret
  namespace: arc-system
spec:
  encryptedData:
    github_app_id: 
    github_app_installation_id: 
    github_app_private_key: 
  template:
    metadata:
      name: github-secret
      namespace: arc-system
    type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.9.3"
      sourceRef:
        kind: HelmRepository
        name: arc-charts
        namespace: flux-system
      interval: 10m
  values:
    nodeSelector:
      role: ci-cd
    tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "ci-cd"
        effect: "NoSchedule"
    githubConfigUrl: https://github.com/sigma-gaming
    githubConfigSecret: github-token

    template:
      spec:
        containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/home/runner/run.sh"]
          env:
            - name: ACTIONS_RUNNER_CONTAINER_HOOKS
              value: /home/runner/k8s/index.js
            - name: ACTIONS_RUNNER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
              value: "true"
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: workspace
              mountPath: /home/runner/workspace
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: [ "ReadWriteOnce" ]
                  storageClassName: "local-path"
                  resources:
                    requests:
                      storage: 1Gi