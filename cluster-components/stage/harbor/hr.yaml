apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor
  namespace: flux-system
spec:
  interval: 1m
  url: https://helm.goharbor.io
---
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-admin-password
  namespace: harbor
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: harbor-admin-password
      namespace: harbor
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-secret-key
  namespace: harbor
spec:
  encryptedData:
    secretKey: 
  template:
    metadata:
      name: harbor-secret-key
      namespace: harbor
    type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: harbor
      version: "1.15.1"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
      interval: 10m
  values:
    externalURL: https://harbor.sigmacloud.app
    existingSecretAdminPassword: harbor-admin-password
    existingSecretAdminPasswordKey: password
    existingSecretSecretKey: harbor-secret-key
    expose:
      type: ingress
      ingress:
        className: nginx
        hosts:
          core: "harbor.sigmacloud.app"
        annotations:
          cert-manager.io/cluster-issuer: selfsigned
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
          nginx.ingress.kubernetes.io/auth-url: https://auth.sigmacloud.app/oauth2/auth
          nginx.ingress.kubernetes.io/auth-signin: https://auth.sigmacloud.app/oauth2/start?rd=$scheme://$host$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-snippet: |
            if ($request_uri ~ ^/v2) {
              return 200;
            }

            if ($request_uri ~ ^/service/) {
              return 200;
            }

            if ($request_method = OPTIONS) {
              return 200;
            }
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor.sigmacloud.app-cert
    trivy:
      enabled: false
    portal:
      nodeSelector:
        role: ci-cd
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci-cd"
          effect: "NoSchedule"
    core:
      nodeSelector:
        role: ci-cd
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci-cd"
          effect: "NoSchedule"
    jobservice:
      nodeSelector:
        role: ci-cd
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci-cd"
          effect: "NoSchedule"
    registry:
      nodeSelector:
        role: ci-cd
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci-cd"
          effect: "NoSchedule"
    exporter:
      nodeSelector:
        role: ci-cd
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci-cd"
          effect: "NoSchedule"
    database:
      internal:
        nodeSelector:
          role: ci-cd
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "ci-cd"
            effect: "NoSchedule"
    redis:
      internal:
        nodeSelector:
          role: ci-cd
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "ci-cd"
            effect: "NoSchedule"
