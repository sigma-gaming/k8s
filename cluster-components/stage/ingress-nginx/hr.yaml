apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 1m
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
data:
  ca.crt: 
kind: Secret
metadata:
  name: cloudflare-root-cert
  namespace: ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ingress-nginx
      version: "4.11.3"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 10m
  values:
    controller:
      admissionWebhooks:
        certManager:
          enabled: true
      service:
        type: NodePort
      hostNetwork: true
      hostPort:
        enabled: true
      dnsPolicy: ClusterFirstWithHostNet
      kind: DaemonSet

      # for auth proxies
      allowSnippetAnnotations: true

      nodeSelector:
        kubernetes.io/os: linux
        has-ingress: "true"
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ci-cd"
          effect: "NoSchedule"

      metrics:
        enabled: true
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"
