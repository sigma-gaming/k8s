apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  interval: 1m
  url: https://victoriametrics.github.io/helm-charts
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.31.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      interval: 10m
  driftDetection:
    mode: enabled
  upgrade:
    remediation:
      retries: -1
  values:
    victoria-metrics-operator:
      nodeSelector:
        role: monitoring
    vmsingle:
      spec:
        nodeSelector:
          role: monitoring
    alertmanager:
      spec:
        nodeSelector:
          role: monitoring
    vmalert:
      spec:
        nodeSelector:
          role: monitoring
    kube-state-metrics:
      image:
        registry: docker.io
        repository: bitnami/kube-state-metrics
        tag: "2.14.0"
    grafana:
      nodeSelector:
        role: monitoring
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: selfsigned
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
          nginx.ingress.kubernetes.io/auth-url: https://auth.sigmacloud.app/oauth2/auth
          nginx.ingress.kubernetes.io/auth-signin: https://auth.sigmacloud.app/oauth2/start?rd=$scheme://$host$escaped_request_uri
          nginx.ingress.kubernetes.io/auth-snippet: |
            if ($request_method = OPTIONS) {
              return 200;
            }
        hosts:
          - grafana.sigmacloud.app
        tls:
          - hosts:
              - grafana.sigmacloud.app
            secretName: grafana.sigmacloud.app-cert
