apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: games-db
  namespace: games-dev
spec:
  instances: 1

  storage:
    size: 10Gi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: redis-password
  namespace: games-dev
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: redis-password
      namespace: games-dev
    type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: games-dev
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: redis
      version: '19.6.0'
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 10m
  values:
    architecture: standalone
    auth:
      existingSecret: redis-password
      existingSecretPasswordKey: password
    replica:
      replicaCount: 1
