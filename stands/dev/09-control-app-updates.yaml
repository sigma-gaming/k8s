apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: control-app
  namespace: games-dev
spec:
  image: europe-west4-docker.pkg.dev/sigma-games/docker/apps/control-app
  secretRef:
    name: google-registry-creds
  interval: 30s
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: control-app
  namespace: games-dev
spec:
  imageRepositoryRef:
    name: control-app
  filterTags:
    pattern: '^dev-(?P<timestamp>.*)'
    extract: '$timestamp'
  policy:
    numerical:
      order: asc