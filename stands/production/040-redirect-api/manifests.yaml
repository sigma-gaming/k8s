apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: redirect-api
  namespace: games-production
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/live-api
      version: "1.2.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    name: redirect-api
    replicaCount: 1
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/redirect-api
      tag: dev-1741561454444 # {"$imagepolicy": "games-production:redirect-api:tag"}
    ports:
      public: 8080
      internal: 9090
    ingress:
      hosts:
        - sigm.to
    migration:
      tag: dev-1741565539968 # {"$imagepolicy": "games-production:core-migrations:tag"}
    env:
      - name: CoreDb__Host
        value: "core-db-pooler-rw"
      - name: CoreDb__Username
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: user
      - name: CoreDb__Password
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: password
      - name: CoreDb__Database
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: dbname
      - name: CoreCache__Host
        value: "core-dragonfly"
      - name: CoreCache__Password
        valueFrom:
          secretKeyRef:
            name: core-dragonfly-auth
            key: password
      - name: CoreCache__Version
        value: "dev-1741561454444" # {"$imagepolicy": "games-production:core-api:tag"}
