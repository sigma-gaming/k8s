apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: access-api
  namespace: games-production
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/live-api
      version: "1.0.2"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  upgrade:
    remediation:
      retries: -1
  values:
    name: access-api
    replicaCount: 1
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/apis/access-api
      tag: dev-1736715718581 # {"$imagepolicy": "games-production:access-api:tag"}
    ports:
      public: 8080
      internal: 9090
    ingress:
      enabled: false
    migration:
      tag: dev-1736632711733 # {"$imagepolicy": "games-production:games-db-migration:tag"}
    env:
      - name: NODE_ENV
        value: "production"
      - name: ACCESS_API_PORT
        value: "8080"
      - name: ACCESS_API_INTERNAL_PORT
        value: "9090"
      - name: PUBLIC_GAMES_API_VERSION
        value: "dev-1736676793384" # {"$imagepolicy": "games-production:games-api:tag"}
      - name: GAMES_DB_HOST
        value: "games-db-pooler-rw"
      - name: GAMES_DB_HEALTH_HOST
        value: "games-db-health-pooler-rw"
      - name: GAMES_DB_USER
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: user
      - name: GAMES_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: password
      - name: GAMES_DB_DATABASE
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: dbname
      - name: GAMES_CACHE_HOST
        value: "games-dragonfly"
      - name: GAMES_CACHE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-dragonfly-auth
            key: password
      - name: JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: jwt-secret
            key: secret
