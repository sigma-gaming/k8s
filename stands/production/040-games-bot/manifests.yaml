apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: games-bot
  namespace: games-production
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/live-api
      version: "1.0.3"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  upgrade:
    remediation:
      retries: -1
  values:
    name: games-bot
    replicaCount: 1
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/bots/games-bot
      tag: dev-1740750828934 # {"$imagepolicy": "games-production:games-bot:tag"}
    ports:
      public: 8080
      internal: 9090
    ingress:
      hosts:
        - games-bot.sigmacloud.app
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    migration:
      tag: dev-1740680312501 # {"$imagepolicy": "games-production:games-db-migration:tag"}
    env:
      - name: NODE_ENV
        value: "production"
      - name: GAMES_BOT_PORT
        value: "8080"
      - name: GAMES_BOT_INTERNAL_PORT
        value: "9090"
      - name: PUBLIC_GAMES_API_VERSION
        value: "dev-1740750087959" # {"$imagepolicy": "games-production:games-api:tag"}
      - name: GAMES_BOT_URL
        value: "https://games-bot.sigmacloud.app"
      - name: GAMES_DB_HOST
        value: "games-db-pooler-rw"
      - name: GAMES_DB_HEALTH_HOST
        value: "games-db-health-pooler-rw"
      - name: GAMES_DB_USER
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: user
      - name: GAMES_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: password
      - name: GAMES_DB_DATABASE
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: dbname
      - name: GAMES_CACHE_HOST
        value: "games-dragonfly"
      - name: GAMES_CACHE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-dragonfly-auth
            key: password
      - name: PUBLIC_TELEGRAM_BOT_ID
        valueFrom:
          configMapKeyRef:
            name: telegram
            key: bot-id
      - name: TELEGRAM_BOT_TOKEN
        valueFrom:
          secretKeyRef:
            name: telegram
            key: bot-token
      - name: TELEGRAM_WEBHOOK_SECRET_TOKEN
        valueFrom:
          secretKeyRef:
            name: telegram
            key: webhook-secret-token
