apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: games-tasks
  namespace: games-production
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/live-tasks
      version: "1.1.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: false
  values:
    name: games-tasks
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/apis/games-tasks
      tag: dev-1740754376255 # {"$imagepolicy": "games-production:games-tasks:tag"}
    migration:
      tag: dev-1741565539968 # {"$imagepolicy": "games-production:core-migrations:tag"}
    jobEnvName: GAMES_TASKS_JOB
    jobs:
      - name: ProcessReferrerPayouts
        schedule: "0 */1 * * *" # every 1 hour
      - name: InitializeChatMessages
        schedule: "*/10 * * * *" # every 10 minutes
      - name: ProcessStaleDeposits
        schedule: "*/10 * * * *" # every 10 minutes
      - name: ProcessStaleWithdrawals
        schedule: "*/10 * * * *" # every 10 minutes
      - name: SyncBudget
        schedule: "*/5 * * * *" # every 5 minutes
      - name: UpdateCurrencyRates
        schedule: "*/5 * * * *" # every 5 minutes
      - name: SendAdvancedGamesMetrics
        schedule: "*/5 * * * *" # every 5 minutes
    env:
      - name: NODE_ENV
        value: "production"
      - name: PUBLIC_STAGE
        value: "production"
      - name: CoreCache__Version
        value: "dev-1741561454444" # {"$imagepolicy": "games-production:core-api:tag"}
      - name: GAMES_TASKS_MODE
        value: "task"
      - name: PUBLIC_GAMES_TASKS_VERSION
        value: "dev-1740754376255" # {"$imagepolicy": "games-production:games-tasks:tag"}
      - name: GAMES_DB_HOST
        value: "core-db-pooler-rw"
      - name: GAMES_DB_USER
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: user
      - name: GAMES_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: password
      - name: GAMES_DB_DATABASE
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: dbname
      - name: GAMES_CACHE_HOST
        value: "core-dragonfly"
      - name: GAMES_CACHE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: core-dragonfly-auth
            key: password
      - name: BOVAPAY_API_URL
        value: "https://bovatech.cc"
      - name: BOVAPAY_API_KEY
        value: "123"
      - name: BOVAPAY_CALLBACK_URL
        value: "https://payment.sigmacloud.app/bovapay"
      - name: METRICS_NAMESPACE
        value: "games-production"
      - name: METRICS_PUSHGATEWAY_URL
        value: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8429/api/v1/import/prometheus"
