apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: games-bot
  namespace: games-production
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/live-api
      version: "1.2.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    name: games-bot
    replicaCount: 1
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/bots/games-bot
      tag: dev-1741562544474 # {"$imagepolicy": "games-production:games-bot:tag"}
    ports:
      public: 8080
      internal: 9090
    ingress:
      hosts:
        - games-bot.sigmacloud.app
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    migration:
      tag: dev-1741565539968 # {"$imagepolicy": "games-production:core-migrations:tag"}
    env:
      - name: NODE_ENV
        value: "production"
      - name: GAMES_BOT_PORT
        value: "8080"
      - name: GAMES_BOT_INTERNAL_PORT
        value: "9090"
      - name: GAMES_BOT_URL
        value: "https://games-bot.sigmacloud.app"
      - name: DOMAIN_API_URL
        value: "http://domain-api:8080"
      - name: AFFILIATE_API_URL
        value: "http://affiliate-api:8080"
      - name: PUBLIC_TELEGRAM_BOT_ID
        valueFrom:
          secretKeyRef:
            name: telegram
            key: bot-id
      - name: TELEGRAM_BOT_TOKEN
        valueFrom:
          secretKeyRef:
            name: telegram
            key: bot-token
      - name: TELEGRAM_WEBHOOK_SECRET_TOKEN
        valueFrom:
          secretKeyRef:
            name: telegram
            key: webhook-secret-token
