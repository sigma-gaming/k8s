apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: control-api
  namespace: games-production
spec:
  interval: 5m
  timeout: 3m
  chart:
    spec:
      chart: ./charts/live-api
      version: "1.2.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: false
  values:
    name: control-api
    replicaCount: 1
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/control-api
      tag: dev-1747154783495 # {"$imagepolicy": "games-production:control-api:tag"}
    ports:
      public: 8080
      internal: 9090
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/auth-url: https://auth.sigmacloud.app/oauth2/auth
        nginx.ingress.kubernetes.io/auth-signin: https://auth.sigmacloud.app/oauth2/start?rd=$scheme://$host$escaped_request_uri
        nginx.ingress.kubernetes.io/auth-snippet: |
          if ($request_method = OPTIONS) {
            return 200;
          }
      hosts:
        - control-api.sigmacloud.app
      extraTemplates:
        - metadata:
            name: control-api-access
            annotations:
              nginx.ingress.kubernetes.io/use-regex: "true"
              nginx.ingress.kubernetes.io/rewrite-target: /$2
          spec:
            rules:
              http:
                paths:
                  - path: /access(/|$)(.*)
                    pathType: ImplementationSpecific
                    backend:
                      service:
                        name: access-api
                        port:
                          name: public
    migration:
      tag: dev-1741880803845 # {"$imagepolicy": "games-production:core-migrations:tag"}
    env:
      - name: CoreDb__Host
        value: "core-db-pooler-rw"
      - name: CoreDb__Username
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: user
      - name: CoreDb__Password
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: password
      - name: CoreDb__Database
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: dbname
      - name: CoreCache__Host
        value: "core-dragonfly"
      - name: CoreCache__Password
        valueFrom:
          secretKeyRef:
            name: core-dragonfly-auth
            key: password
      - name: CoreCache__Version
        value: "dev-1747154783495" # {"$imagepolicy": "games-production:core-api:tag"}
      - name: CoreNats__Url
        value: "nats://core-nats:4222"
