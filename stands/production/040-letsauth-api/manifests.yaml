apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: letsauth-api
  namespace: games-production
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/live-api
      version: "1.2.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: false
  values:
    name: letsauth-api
    replicaCount: 1
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/letsauth-api
      tag: dev-1741868898691 # {"$imagepolicy": "games-production:letsauth-api:tag"}
    ports:
      public: 8080
      internal: 9090
    resources:
      requests:
        cpu: "125m"
        memory: "128Mi"
    ingress:
      hosts:
        - api.letsauth.app
    metrics:
      enabled: true
    migration:
      tag: dev-1741837502636 # {"$imagepolicy": "games-production:core-migrations:tag"}
    env:
      - name: Api__ClientUrl
        value: "https://letsauth.app"
      - name: CoreDb__Host
        value: "core-db-pooler-rw"
      - name: CoreDb__Username
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: user
      - name: CoreDb__Password
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: password
      - name: CoreDb__Database
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: dbname
      - name: CoreCache__Host
        value: "core-dragonfly"
      - name: CoreCache__Password
        valueFrom:
          secretKeyRef:
            name: core-dragonfly-auth
            key: password
      - name: CoreCache__Version
        value: "dev-1741561454444" # {"$imagepolicy": "games-production:core-api:tag"}
      - name: Api__RateLimitBypassToken
        valueFrom:
          secretKeyRef:
            name: bypass-tokens
            key: rate-limit
      - name: Telegram__BotToken
        valueFrom:
          secretKeyRef:
            name: telegram
            key: bot-token
      - name: Vk__ServiceToken
        value: "123"
