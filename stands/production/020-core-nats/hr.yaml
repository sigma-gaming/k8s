apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: flux-system
spec:
  interval: 1h
  url: https://nats-io.github.io/k8s/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: core-nats
  namespace: games-production
spec:
  interval: 5m
  timeout: 3m
  chart:
    spec:
      chart: nats
      version: '1.2.11'
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
      interval: 10m
  values:
    config:
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 10Gi
    service:
      name: core-nats