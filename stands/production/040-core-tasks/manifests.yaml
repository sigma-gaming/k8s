apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: core-tasks
  namespace: games-production
spec:
  interval: 5m
  timeout: 3m
  chart:
    spec:
      chart: ./charts/live-api
      version: "1.2.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: -1
      remediateLastFailure: false
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: false
  values:
    name: core-tasks
    replicaCount: 1
    nodeSelector:
      role: application
      environment: production
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/core-tasks
      tag: dev-1747414035172 # {"$imagepolicy": "games-production:core-tasks:tag"}
    ports:
      public: 8080
      internal: 9090
    resources:
      requests:
        cpu: "125m"
        memory: "128Mi"
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/auth-url: https://auth.sigmacloud.app/oauth2/auth
        nginx.ingress.kubernetes.io/auth-signin: https://auth.sigmacloud.app/oauth2/start?rd=$scheme://$host$escaped_request_uri
        nginx.ingress.kubernetes.io/auth-snippet: |
          if ($request_method = OPTIONS) {
            return 200;
          }
      hosts:
        - tasks.sigmacloud.app
    metrics:
      enabled: true
    migration:
      tag: dev-1747414035172 # {"$imagepolicy": "games-production:core-migrations:tag"}
    env:
      - name: CoreDb__Host
        value: "core-db-pooler-rw"
      - name: CoreDb__Username
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: user
      - name: CoreDb__Password
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: password
      - name: CoreDb__Database
        valueFrom:
          secretKeyRef:
            name: core-db-app
            key: dbname
      - name: CoreCache__Host
        value: "core-dragonfly"
      - name: CoreCache__Password
        valueFrom:
          secretKeyRef:
            name: core-dragonfly-auth
            key: password
      - name: CoreCache__Version
        value: "dev-1747414035172" # {"$imagepolicy": "games-production:core-tasks:tag"}
      - name: CoreNats__Url
        value: "nats://core-nats:4222"
      - name: Payment__Coincap__ApiKey
        valueFrom:
          secretKeyRef:
            name: payment
            key: coincap-api-key
      - name: Payment__Plisio__ApiKey
        valueFrom:
          secretKeyRef:
            name: payment
            key: plisio-api-key
      - name: Payment__Plisio__StaleDepositTimeoutMinutes
        valueFrom:
          secretKeyRef:
            name: payment
            key: plisio-stale-deposit-timeout-minutes
      - name: Payment__Plisio__StaleWithdrawalTimeoutMinutes
        valueFrom:
          secretKeyRef:
            name: payment
            key: plisio-stale-withdrawal-timeout-minutes
      - name: Payment__CryptoCloud__ApiKey
        valueFrom:
          secretKeyRef:
            name: payment
            key: cryptocloud-api-key
      - name: Payment__CryptoCloud__SecretKey
        valueFrom:
          secretKeyRef:
            name: payment
            key: cryptocloud-secret-key
      - name: Payment__CryptoCloud__StaleDepositTimeoutMinutes
        valueFrom:
          secretKeyRef:
            name: payment
            key: cryptocloud-stale-deposit-timeout-minutes
      - name: Payment__CryptoCloud__StaleWithdrawalTimeoutMinutes
        valueFrom:
          secretKeyRef:
            name: payment
            key: cryptocloud-stale-withdrawal-timeout-minutes
      - name: Metrics__PushgatewayUrl
        value: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8429/api/v1/import/prometheus"
      - name: Metrics__Namespace
        value: "games-production"
