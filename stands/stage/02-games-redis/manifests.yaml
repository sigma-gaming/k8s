apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: redis-password
  namespace: games-stage
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: redis-password
      namespace: games-stage
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: games-redis-password
  namespace: games-stage
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: games-redis-password
      namespace: games-stage
    type: Opaque
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: games-redis
  namespace: games-stage
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: redis
      version: '19.6.0'
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      interval: 10m
  values:
    architecture: standalone
    auth:
      existingSecret: games-redis-password
      existingSecretPasswordKey: password
    master:
      persistence:
        size: 2Gi
    replica:
      replicaCount: 1
