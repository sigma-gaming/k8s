apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: control-access-api
  namespace: games-stage
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/prod-api
      version: "0.2.1"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  upgrade:
    remediation:
      retries: -1
  values:
    name: control-access-api
    replicaCount: 1
    image:
      repository: europe-west1-docker.pkg.dev/sigma-games/docker/apis/access-api
      tag: dev-1734199813253 # {"$imagepolicy": "games-stage:control-access-api:tag"}
    ingress:
      host: access.sigmacloud.app
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
        nginx.ingress.kubernetes.io/auth-url: https://auth.sigmacloud.app/oauth2/auth
        nginx.ingress.kubernetes.io/auth-signin: https://auth.sigmacloud.app/oauth2/start?rd=$scheme://$host$escaped_request_uri
        nginx.ingress.kubernetes.io/auth-snippet: |
          if ($request_method = OPTIONS) {
            return 200;
          }
    service:
      port: 5055
    migration:
      tag: dev-1734196645762 # {"$imagepolicy": "games-stage:games-db-migration:tag"}
    env:
      - name: NODE_ENV
        value: "production"
      - name: PUBLIC_GAMES_APP_URL
        value: "https://sigma1.games"
      - name: PUBLIC_CONTROL_APP_URL
        value: "https://control.sigmacloud.app"
      - name: PUBLIC_GAMES_API_VERSION
        value: "dev-1734199813253" # {"$imagepolicy": "games-stage:games-api:tag"}
      - name: PUBLIC_ACCESS_DOMAIN
        value: "sigmacloud.app"
      - name: PUBLIC_ACCESS_API_URL
        value: "https://access.sigmacloud.app"
      - name: GAMES_DB_URL
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: uri
      - name: GAMES_CACHE_HOST
        value: "games-dragonfly"
      - name: GAMES_CACHE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-dragonfly-auth
            key: password
      - name: JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: jwt-secret
            key: secret
