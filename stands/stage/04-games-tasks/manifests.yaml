apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: games-tasks
  namespace: games-stage
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/prod-tasks
      version: "0.1.4"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  upgrade:
    remediation:
      retries: -1
  values:
    name: games-tasks
    image:
      repository: europe-west1-docker.pkg.dev/sigma-games/docker/apis/games-tasks
      tag: dev-1734649464037 # {"$imagepolicy": "games-stage:games-tasks:tag"}
    migration:
      tag: dev-1734629164630 # {"$imagepolicy": "games-stage:games-db-migration:tag"}
    jobEnvName: GAMES_TASKS_JOB
    jobs:
      - name: InitializeChatMessages
        schedule: "0 */1 * * *" # every 1 hour
      - name: ProcessReferrerPayouts
        schedule: "0 */1 * * *" # every 1 hour
      - name: ProcessStaleDeposits
        schedule: "*/10 * * * *" # every 10 minutes
      - name: ProcessStaleWithdrawals
        schedule: "*/10 * * * *" # every 10 minutes
      - name: SyncBudget
        schedule: "*/5 * * * *" # every 5 minutes
      - name: UpdateCurrencyRates
        schedule: "*/5 * * * *" # every 5 minutes
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "125m"
        memory: "128Mi"
    env:
      - name: NODE_ENV
        value: "production"
      - name: PUBLIC_STAGE
        value: "production"
      - name: PUBLIC_GAMES_API_VERSION
        value: "dev-1734649464037" # {"$imagepolicy": "games-stage:games-api:tag"}
      - name: GAMES_TASKS_MODE
        value: "task"
      - name: PUBLIC_GAMES_TASKS_VERSION
        value: "dev-1734649464037" # {"$imagepolicy": "games-stage:games-tasks:tag"}
      - name: GAMES_DB_HOST
        value: "games-db-pooler-rw"
      - name: GAMES_DB_USER
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: user
      - name: GAMES_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: password
      - name: GAMES_DB_DATABASE
        valueFrom:
          secretKeyRef:
            name: games-db-app
            key: dbname
      - name: GAMES_CACHE_HOST
        value: "games-dragonfly"
      - name: GAMES_CACHE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-dragonfly-auth
            key: password
      - name: JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: jwt-secret
            key: secret
      - name: BOVAPAY_API_URL
        value: "https://bovatech.cc"
      - name: BOVAPAY_API_KEY
        valueFrom:
          secretKeyRef:
            name: bovapay
            key: api-key
      - name: BOVAPAY_CALLBACK_URL
        value: "https://payment.sigmacloud.app/bovapay"
