apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: games-ws
  namespace: games-stage
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/prod-api
      version: "0.2.1"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  upgrade:
    remediation:
      retries: -1
  values:
    name: games-ws
    replicaCount: 1
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/apis/games-ws
      tag: dev-1730329126808 # {"$imagepolicy": "games-stage:games-ws:tag"}
    ingress:
      host: ws.sigma1.games
      annotations:
        nginx.ingress.kubernetes.io/upstream-hash-by: "$cookie_sticky"
    service:
      port: 5052
    migration:
      tag: dev-1730329171177 # {"$imagepolicy": "games-stage:games-db-migration:tag"}
    env:
      - name: NODE_ENV
        value: "production"
      - name: PUBLIC_STAGE
        value: "production"
      - name: PUBLIC_DOMAIN
        value: "sigma1.games"
      - name: PUBLIC_GAMES_APP_URL
        value: "https://sigma1.games"
      - name: PUBLIC_GAMES_API_VERSION
        value: "dev-1730459982622" # {"$imagepolicy": "games-stage:games-api:tag"}
      - name: PUBLIC_GAMES_WS_URL
        value: "wss://ws.sigma1.games"
      - name: PUBLIC_GAMES_WS_VERSION
        value: "dev-1730329126808" # {"$imagepolicy": "games-stage:games-ws:tag"}
      - name: GAMES_DB_HOST
        value: "games-db-primary.games-stage"
      - name: GAMES_DB_USER
        valueFrom:
          secretKeyRef:
            name: games-db
            key: superuser-username
      - name: GAMES_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-db
            key: superuser-password
      - name: GAMES_REDIS_HOST
        value: "games-dragonfly"
      - name: GAMES_REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-dragonfly-auth
            key: password
      - name: JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: jwt-secret
            key: secret
      - name: PUBLIC_TELEGRAM_BOT_ID
        valueFrom:
          configMapKeyRef:
            name: telegram
            key: bot-id
      - name: TELEGRAM_BOT_TOKEN
        valueFrom:
          secretKeyRef:
            name: telegram
            key: bot-token
      - name: VK_SERVICE_TOKEN
        value: "12345"
      - name: VK_GROUP_TOKEN
        value: "54321"
