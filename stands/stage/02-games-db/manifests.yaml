apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: games-db-superuser
  namespace: games-stage
spec:
  encryptedData:
    username: cG9zdGdyZXM=
    password: 
  template:
    metadata:
      name: games-db-superuser
      namespace: games-stage
      labels:
        cnpg.io/reload: "true"
    type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: games-db
  namespace: games-stage
spec:
  instances: 1

  enableSuperuserAccess: true
  superuserSecret:
    name: games-db-superuser

  storage:
    size: 10Gi
