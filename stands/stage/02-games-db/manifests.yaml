apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backup-creds
  namespace: games-stage
spec:
  encryptedData:
    gcs-credentials: 
  template:
    metadata:
      name: backup-creds
      namespace: games-stage
    type: Opaque
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: games-db
  namespace: games-stage
spec:
  instances: 1

  enableSuperuserAccess: true

  storage:
    size: 10Gi

  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "8MB"

  backup:
    barmanObjectStore:
      destinationPath: gs://stage-games-db-backups
      googleCredentials:
        applicationCredentials:
          name: backup-creds
          key: gcs-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: games-db-pooler-rw
  namespace: games-stage
spec:
  cluster:
    name: games-db

  type: rw

  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "200"
      default_pool_size: "20"
      min_pool_size: "5"
      reserve_pool_size: "5"
      server_idle_timeout: "300"

  template:
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: "0.5"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
