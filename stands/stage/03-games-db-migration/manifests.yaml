apiVersion: batch/v1
kind: Job
metadata:
  name: games-db-migration- # version is appended in kustomization.yaml
  namespace: games-stage
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector:
        role: application
        environment: stage
      imagePullSecrets:
        - name: google-registry-creds
      containers:
        - name: games-db-migration
          image: europe-west1-docker.pkg.dev/sigma-games/docker/migrations/games-db-migration:dev-1734199813253 # {"$imagepolicy": "games-stage:games-db-migration"}
          env:
            - name: NODE_ENV
              value: "production"
            - name: GAMES_DB_URL
              valueFrom:
                secretKeyRef:
                  name: games-db-app
                  key: uri
      restartPolicy: Never
