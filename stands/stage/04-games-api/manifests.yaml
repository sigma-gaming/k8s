apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: games-api
  namespace: games-stage
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./charts/prod-api
      version: "0.2.1"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m
  driftDetection:
    mode: enabled
  upgrade:
    remediation:
      retries: -1
  values:
    name: games-api
    replicaCount: 1
    image:
      repository: europe-west4-docker.pkg.dev/sigma-games/docker/apis/games-api
      tag: dev-1730552423015 # {"$imagepolicy": "games-stage:games-api:tag"}
    ingress:
      host: api.sigma1.games
    service:
      port: 5050
    migration:
      tag: dev-1730461025667 # {"$imagepolicy": "games-stage:games-db-migration:tag"}
    env:
      - name: NODE_ENV
        value: "production"
      - name: PUBLIC_STAGE
        value: "production"
      - name: PUBLIC_DOMAIN
        value: "sigma1.games"
      - name: PUBLIC_GAMES_APP_URL
        value: "https://sigma1.games"
      - name: PUBLIC_GAMES_API_URL
        value: "https://api.sigma1.games"
      - name: PUBLIC_GAMES_API_VERSION
        value: "dev-1730552423015" # {"$imagepolicy": "games-stage:games-api:tag"}
      - name: GAMES_DB_HOST
        value: "games-db-primary.games-stage"
      - name: GAMES_DB_USER
        valueFrom:
          secretKeyRef:
            name: games-db
            key: superuser-username
      - name: GAMES_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-db
            key: superuser-password
      - name: GAMES_REDIS_HOST
        value: "games-dragonfly"
      - name: GAMES_REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: games-dragonfly-auth
            key: password
      - name: JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: jwt-secret
            key: secret
