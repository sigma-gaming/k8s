apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-app
  namespace: games-dev
  labels:
    app: games-app
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: games-app
  template:
    metadata:
      namespace: games-dev
      labels:
        app: games-app
    spec:
      imagePullSecrets:
        - name: google-registry-creds
      containers:
        - name: games-app
          image: europe-west4-docker.pkg.dev/sigma-games/docker/apps/games-app:dev-1721261949816 # {"$imagepolicy": "games-dev:games-app"}
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthy
              port: 80
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PUBLIC_STAGE
              value: "dev"
            - name: PUBLIC_DOMAIN
              value: "sigmacloud.app"
            - name: PUBLIC_GAMES_APP_URL
              value: "https://sigmacloud.app"
            - name: PUBLIC_GAMES_APP_VERSION
              value: "dev-1721261949816" # {"$imagepolicy": "games-dev:games-app:tag"}
            - name: PUBLIC_GAMES_API_URL
              value: "https://api.sigmacloud.app"
            - name: PUBLIC_GAMES_WS_URL
              value: "https://ws.sigmacloud.app"
            - name: PUBLIC_TELEGRAM_BOT_ID
              value: "6551119896"
            - name: PUBLIC_VK_APP_ID
              value: "51986547"
---
apiVersion: v1
kind: Service
metadata:
  name: games-app
  namespace: games-dev
spec:
  selector:
    app: games-app
  ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-app
  namespace: games-dev
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    # nginx.ingress.kubernetes.io/custom-http-errors: '503'
    nginx.ingress.kubernetes.io/default-backend: maintenance-app
    nginx.ingress.kubernetes.io/auth-url: |-
      http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: |-
      https://sigmacloud.app/outpost.goauthentik.io/start?rd=$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: |-
      Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $host;

      if ($request_method = OPTIONS) {
        return 200;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sigmacloud.app
      secretName: sigmacloud.app-cert
  rules:
    - host: sigmacloud.app
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: games-app
                port:
                  number: 80
