apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-ws
  namespace: games-dev
  labels:
    app: games-ws
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: games-ws
  template:
    metadata:
      namespace: games-dev
      labels:
        app: games-ws
    spec:
      imagePullSecrets:
        - name: google-registry-creds
      containers:
        - name: games-ws
          image: europe-west4-docker.pkg.dev/sigma-games/docker/apis/games-ws:dev-1720946197517 # {"$imagepolicy": "games-dev:games-ws"}
          ports:
            - containerPort: 5052
          livenessProbe:
            httpGet:
              path: /healthy
              port: 5052
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 5052
            initialDelaySeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PUBLIC_STAGE
              value: "dev"
            - name: PUBLIC_DOMAIN
              value: "sigmacloud.app"
            - name: PUBLIC_GAMES_APP_URL
              value: "https://sigmacloud.app"
            - name: PUBLIC_GAMES_API_URL
              value: "https://api.sigmacloud.app"
            - name: PUBLIC_GAMES_API_VERSION
              value: "dev-1720939906252" # {"$imagepolicy": "games-dev:games-api:tag"}
            - name: PUBLIC_GAMES_WS_URL
              value: "https://ws.sigmacloud.app"
            - name: PUBLIC_GAMES_WS_VERSION
              value: "dev-1720946197517" # {"$imagepolicy": "games-dev:games-ws:tag"}
            - name: PUBLIC_CONTROL_APP_URL
              value: "https://control.sigmacloud.app"
            - name: PUBLIC_CONTROL_API_URL
              value: "https://control-api.sigmacloud.app"
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: games-db-app
                  key: uri
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            - name: JWT_SECRET
              value: "SECRET_REMOVED"
            - name: PUBLIC_TELEGRAM_BOT_ID
              value: "6551119896"
            - name: TELEGRAM_BOT_TOKEN
              value: "SECRET_REMOVED"
            - name: PUBLIC_VK_APP_ID
              value: "51986547"
            - name: VK_APP_SECRET
              value: "SECRET_REMOVED"
            - name: VK_SERVICE_TOKEN
              value: "SECRET_REMOVED"
---
apiVersion: v1
kind: Service
metadata:
  name: games-ws
  namespace: games-dev
spec:
  selector:
    app: games-ws
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5052
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-ws
  namespace: games-dev
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    nginx.ingress.kubernetes.io/auth-url: |-
      http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    nginx.ingress.kubernetes.io/auth-signin: |-
      https://sigmacloud.app/outpost.goauthentik.io/start?rd=$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: |-
      Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
    nginx.ingress.kubernetes.io/auth-snippet: |
      proxy_set_header X-Forwarded-Host $host;

      if ($request_method = OPTIONS) {
        return 200;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ws.sigmacloud.app
      secretName: ws.sigmacloud.app-cert
  rules:
    - host: ws.sigmacloud.app
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: games-ws
                port:
                  number: 80
