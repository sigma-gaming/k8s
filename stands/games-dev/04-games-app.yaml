apiVersion: apps/v1
kind: Deployment
metadata:
  name: games-app
  namespace: games-dev
  labels:
    app: games-app
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: games-app
  template:
    metadata:
      namespace: games-dev
      labels:
        app: games-app
    spec:
      imagePullSecrets:
        - name: google-registry-creds
      containers:
        - name: games-app
          image: europe-west4-docker.pkg.dev/sigma-games/docker/apps/games-app:dev-1719818388613 # {"$imagepolicy": "games-dev:games-app"}
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PUBLIC_DOMAIN
              value: "sigmacloud.app"
            - name: PUBLIC_GAMES_APP_URL
              value: "https://sigmacloud.app"
            - name: PUBLIC_GAMES_APP_VERSION
              value: "dev-1719818388613" # {"$imagepolicy": "games-dev:games-app:tag"}
            - name: PUBLIC_GAMES_API_URL
              value: "https://api.sigmacloud.app"
            - name: PUBLIC_GAMES_WS_URL
              value: "https://ws.sigmacloud.app"
            - name: PUBLIC_TELEGRAM_BOT_ID
              value: "6551119896"
            - name: PUBLIC_VK_APP_ID
              value: "51812041"
---
apiVersion: v1
kind: Service
metadata:
  name: games-app
  namespace: games-dev
spec:
  selector:
    app: games-app
  ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-app
  namespace: games-dev
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sigmacloud.app
      secretName: sigmacloud.app-cert
  rules:
    - host: sigmacloud.app
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: games-app
                port:
                  number: 80
