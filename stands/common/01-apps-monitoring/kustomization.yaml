apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - folders.yaml
  - dashboards/nodejs.yaml
  - dashboards/games-ws.yaml
  - dashboards/games-api.yaml

configurations:
  - kustomizeconfig.yaml

configMapGenerator:
  - name: games-api-dashboard
    files:
      - dashboard.json=dashboards/games-api.json

  - name: games-ws-dashboard
    files:
      - dashboard.json=dashboards/games-ws.json
