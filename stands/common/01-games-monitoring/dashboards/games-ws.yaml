apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: games-ws
  namespace: monitoring
spec:
  folderRef: games
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  jsonnet: |
    local grafana = import 'grafonnet-lib/grafonnet.libsonnet';

    local dashboard = grafana.dashboard;
    local row = grafana.row;
    local graphPanel = grafana.graphPanel;
    local tablePanel = grafana.tablePanel;

    local onlineUsersMetric = 'games_ws_online_users';
    local connectionsMetric = 'games_ws_connections';

    // Создаем дэшборд
    {
      apiVersion: 1,
      overwrite: true,
      dashboard: dashboard.new(
        'Games WebSocket Overview',
        // Ряды дэшборда
        [
          row.new('Filters', [
            grafana.templateVar.new('Datasource', {
              type: 'datasource',
              query: 'prometheus',
              label: 'Datasource',
            }),
            grafana.templateVar.new('User Type', {
              type: 'query',
              query: 'label_values(games_ws_online_users, user_type)',
              label: 'User Type',
              includeAll: true,
              allValue: '.+',
            }),
          ]),

          row.new('WebSocket Statistics', [
            graphPanel.new('Online Users by User Type', {
              datasource: '$Datasource',
              targets: [
                {
                  expr: onlineUsersMetric + '{user_type="$User Type"}',
                  legendFormat: 'Online Users ({{user_type}})',
                  refId: 'A',
                },
              ],
              yaxes: [
                { format: 'short', label: 'Users', min: 0 },
                { format: 'short' },
              ],
            }),

            graphPanel.new('Connections by User Type', {
              datasource: '$Datasource',
              targets: [
                {
                  expr: connectionsMetric + '{user_type="$User Type"}',
                  legendFormat: 'Connections ({{user_type}})',
                  refId: 'B',
                },
              ],
              yaxes: [
                { format: 'short', label: 'Connections', min: 0 },
                { format: 'short' },
              ],
            }),
          ]),
        ]
      ),
    }
