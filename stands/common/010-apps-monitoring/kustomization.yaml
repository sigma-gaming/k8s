apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configurations:
  - kustomizeconfig.yaml

resources:
  - folders.yaml
  - dashboards/nodejs.yaml
  - dashboards/games.yaml
  - dashboards/core-ws.yaml

configMapGenerator:
  - name: games-dashboard
    files:
      - dashboard.json=dashboards/games.json

  - name: core-ws-dashboard
    files:
      - dashboard.json=dashboards/core-ws.json
