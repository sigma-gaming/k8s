apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Values.name }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prod-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ .Values.name }}:{{ .Values.service.port }}']
  restartPolicy: Never
