
{{- if .Values.ingress.enabled -}}
  {{- if or (not .Values.service.enabled) (not .Values.ports.public) -}}
    {{- fail "When ingress is enabled, 'service.enabled' and 'ports.public' must be set" -}}
  {{- end -}}
{{- $host := .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prod-app.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/auth-tls-secret: ingress-nginx/cloudflare-origin-ca-cert
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/default-backend: maintenance-app
    {{- if .Values.ingress.annotations }}
      {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    {{- range $i, $host := .Values.ingress.hosts }}
    {{ $parts := splitList "." $host }}
    - hosts:
        - {{ $host }}
      secretName: {{ index $parts (sub (len $parts) 2) }}.{{ index $parts (sub (len $parts) 1) }}-cloudflare-cert
    {{- end }}
  rules:
    {{- range $i, $host := .Values.ingress.hosts }}
    - host: {{ $host }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ $.Values.name }}
                port:
                  name: public
    {{- end }}
{{- end }}
