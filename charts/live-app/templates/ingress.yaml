
{{- if .Values.ingress.enabled -}}
  {{- if or (not .Values.service.enabled) (not .Values.ports.public) -}}
    {{- fail "When ingress is enabled, 'service.enabled' and 'ports.public' must be set" -}}
  {{- end -}}
{{- range $i, $host := $.Values.ingress.hosts }}
{{ $parts := splitList "." $host }}
{{ $secretName := index $parts (sub (len $parts) 2) }}.{{ index $parts (sub (len $parts) 1) }}-cloudflare-tls }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloudflare-tls-store
  target:
    name: {{ $secretName }}
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: {{ $secretName }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prod-app.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/default-backend: maintenance-app
    {{- if .Values.ingress.annotations }}
      {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    {{- range $i, $host := .Values.ingress.hosts }}
    {{ $parts := splitList "." $host }}
    - hosts:
        - {{ $host }}
      secretName: {{ index $parts (sub (len $parts) 2) }}.{{ index $parts (sub (len $parts) 1) }}-cloudflare-tls
    {{- end }}
  rules:
    {{- range $i, $host := .Values.ingress.hosts }}
    - host: {{ $host }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ $.Values.name }}
                port:
                  name: public
    {{- end }}
{{- end }}
