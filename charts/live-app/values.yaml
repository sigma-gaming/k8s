replicaCount: 1

name: "example-app"

# nodeSelector:
#   role: application
#   environment: production

image:
  repository: example-app
  pullPolicy: IfNotPresent
  tag: "latest"

ports:
  # public: 8080
  # internal: 9090

healthchecks:
  enabled: true
  port: internal

service:
  enabled: true

ingress:
  enabled: true
  hosts:
    - "example.com"
  annotations: {}

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "125m"
    memory: "128Mi"

env: []
