{{- if .Values.service.enabled -}}
  {{- if and (not .Values.ports.public) (not .Values.ports.internal) -}}
    {{- fail "When service is enabled, at least one of ports must be set" -}}
  {{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    {{- if .Values.ports.public }}
    - name: public
      port: {{ .Values.ports.public }}
    {{- end }}
    {{- if .Values.ports.internal }}
    - name: internal
      port: {{ .Values.ports.internal }}
    {{- end }}
{{- end }}