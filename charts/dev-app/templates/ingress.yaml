
{{- if .Values.ingress.enabled -}}
{{- $name := .Values.name -}}
{{- $host := .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dev-app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    nginx.ingress.kubernetes.io/default-backend: maintenance-app
    nginx.ingress.kubernetes.io/auth-url: https://sigmacloud.app/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://sigmacloud.app/oauth2/start?rd=$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: Authorization
    nginx.ingress.kubernetes.io/auth-snippet: |
      auth_request_set $name_upstream_1 $upstream_cookie_name_1;

      access_by_lua_block {
        if ngx.var.name_upstream_1 ~= "" then
          ngx.header["Set-Cookie"] = "name_1=" .. ngx.var.name_upstream_1 .. ngx.var.auth_cookie:match("(; .*)")
        end
      }
    {{- if .Values.ingress.annotations }}
      {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ $host }}-cert
  rules:
    - host: {{ $host }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ $name }}
                port:
                  number: 80
{{- end }}
