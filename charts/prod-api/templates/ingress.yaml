{{- if .Values.ingress.enabled -}}
  {{- if or (not .Values.service.enabled) (not .Values.ports.public) -}}
    {{- fail "When ingress is enabled, 'service.enabled' and 'ports.public' must be set" -}}
  {{- end -}}
{{- $host := .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prod-api.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
    {{- if .Values.ingress.annotations }}
      {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  tls:
    {{- range $i, $host := .Values.ingress.hosts }}
    - hosts:
        - {{ $host }}
      secretName: {{ $host }}-cert
    {{- end }}
  rules:
    {{- range $i, $host := .Values.ingress.hosts }}
    - host: {{ $host }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  name: public
    {{- end }}
{{- end }}
