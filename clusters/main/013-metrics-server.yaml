apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 24h
  path: ./shared/metrics-server
  prune: true
  dependsOn:
    - name: kubelet-serving-cert-approver
  sourceRef:
    kind: GitRepository
    name: flux-system
