apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: google-creds-mirror
  namespace: flux-system
spec:
  interval: 5m
  path: ./cluster-components/main/google-creds-mirror
  prune: true
  dependsOn:
    - name: mirrors
  sourceRef:
    kind: GitRepository
    name: flux-system
