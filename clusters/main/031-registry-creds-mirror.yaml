apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-creds-mirror
  namespace: flux-system
spec:
  interval: 1h
  path: ./cluster-components/main/registry-creds-mirror
  prune: true
  dependsOn:
    - name: mirrors
  sourceRef:
    kind: GitRepository
    name: flux-system
