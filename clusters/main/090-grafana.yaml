apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./cluster-components/main/grafana
  prune: true
  dependsOn:
    - name: grafana-operator
    - name: ingress-nginx
    - name: oauth2-proxy
  sourceRef:
    kind: GitRepository
    name: flux-system
