apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 6h
  path: ./cluster-components/main/grafana
  prune: true
  dependsOn:
    - name: grafana-operator
    - name: ingress-nginx
    - name: oauth2-proxy
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: monitoring
      name: grafana-deployment
