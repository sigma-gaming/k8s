apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly-monitoring
  namespace: flux-system
spec:
  interval: 6h
  path: ./shared/dragonfly-monitoring
  prune: true
  dependsOn:
    - name: grafana-operator
    - name: victoria-metrics-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
