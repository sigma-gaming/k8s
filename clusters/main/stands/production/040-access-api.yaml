apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-access-api
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./stands/production/040-access-api
  prune: true
  dependsOn:
    - name: registry-creds-mirror
    - name: production-shared
    - name: production-games-db
    - name: production-games-dragonfly
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: games-production
      name: access-api
