apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-games-db
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./stands/production/020-games-db
  prune: true
  dependsOn:
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
