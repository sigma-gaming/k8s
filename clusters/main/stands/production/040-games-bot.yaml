apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-games-bot
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./stands/production/040-games-bot
  prune: true
  dependsOn:
    - name: registry-creds
    - name: ingress-nginx
    - name: cloudflare-tls-es
    - name: production-shared
    - name: production-games-db
    - name: production-games-dragonfly
    - name: production-games-db-migration
  sourceRef:
    kind: GitRepository
    name: flux-system
