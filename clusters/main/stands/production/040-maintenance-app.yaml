apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-maintenance-app
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./stands/production/040-maintenance-app
  prune: true
  dependsOn:
    - name: registry-creds-mirror
    - name: ingress-nginx
    - name: production-shared
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: games-production
      name: maintenance-app
