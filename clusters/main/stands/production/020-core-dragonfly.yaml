apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-core-dragonfly
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./stands/production/020-core-dragonfly
  prune: true
  dependsOn:
    - name: dragonfly-operator
    - name: victoria-metrics-crds
    - name: production-shared
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      namespace: games-production
      name: core-dragonfly
