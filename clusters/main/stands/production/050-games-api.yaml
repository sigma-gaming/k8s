apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-games-api
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./stands/production/050-games-api
  prune: true
  dependsOn:
    - name: registry-creds-mirror
    - name: ingress-nginx
    - name: cloudflare-tls-es
    - name: production-shared
    - name: production-games-db
    - name: production-games-dragonfly
    - name: production-access-api
  sourceRef:
    kind: GitRepository
    name: flux-system
