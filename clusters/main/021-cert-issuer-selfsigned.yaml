apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-issuer-selfsigned
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./shared/cert-issuer-selfsigned
  prune: true
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
