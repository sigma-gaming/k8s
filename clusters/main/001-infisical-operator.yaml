apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-operator
  namespace: flux-system
spec:
  interval: 24h
  path: ./shared/infisical-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: infisical-operator-system
      name: infisical-opera-controller-manager
