apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  interval: 5m
  path: ./cluster-components/main/oauth2-proxy
  prune: true
  dependsOn:
    - name: ingress-nginx
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: oauth2-proxy
      name: oauth2-proxy
