apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cleanup
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./cluster-components/main/cleanup
  prune: true
  dependsOn:
    - name: sealed-secrets
    - name: registry-creds
  sourceRef:
    kind: GitRepository
    name: flux-system
