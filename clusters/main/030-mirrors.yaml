apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mirrors
  namespace: flux-system
spec:
  interval: 5m
  path: ./shared/mirrors
  prune: true
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      namespace: mirrors
      name: mirrors-controller-manager
