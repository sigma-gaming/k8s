apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./components/authentik
  prune: true
  dependsOn:
  - name: sealed-secrets
  - name: cert-manager
  - name: cert-issuers
  - name: ingress-nginx
  sourceRef:
    kind: GitRepository
    name: flux-system
