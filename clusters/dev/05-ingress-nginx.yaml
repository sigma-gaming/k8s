apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./components/ingress-nginx
  prune: true
  dependsOn:
  - name: cert-manager
  - name: registry-creds
  sourceRef:
    kind: GitRepository
    name: flux-system
  