apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./cluster-components/stage/oauth2-proxy
  prune: true
  dependsOn:
    - name: sealed-secrets
    - name: ingress-nginx
  sourceRef:
    kind: GitRepository
    name: flux-system
