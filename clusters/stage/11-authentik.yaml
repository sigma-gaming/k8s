apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./cluster-components/stage/authentik/hr
  prune: true
  dependsOn:
    - name: sealed-secrets
    - name: cert-manager
    - name: cert-issuers
    - name: authentik-shared
    - name: authentik-db
  sourceRef:
    kind: GitRepository
    name: flux-system
