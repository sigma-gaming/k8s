apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-monitoring
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./shared/cloudnative-pg-monitoring
  prune: true
  dependsOn:
