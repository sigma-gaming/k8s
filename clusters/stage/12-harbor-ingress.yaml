apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-ingress
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./cluster-components/stage/harbor-ingress
  prune: true
  dependsOn:
    - name: ingress-nginx
    - name: oauth2-proxy
    - name: cert-manager
    - name: cert-issuers
    - name: harbor
  sourceRef:
    kind: GitRepository
    name: flux-system