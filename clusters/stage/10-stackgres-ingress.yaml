apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stackgres-ingress
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./cluster-components/stage/stackgres-ingress
  prune: true
  dependsOn:
    - name: ingress-nginx
    - name: oauth2-proxy
    - name: stackgres
  sourceRef:
    kind: GitRepository
    name: flux-system
