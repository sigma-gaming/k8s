apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configurations:
  - kustomizeconfig.yaml

resources:
  - scrapes.yaml
  - folders.yaml
  - dashboards/nginx.yaml
  - dashboards/requests-performance.yaml

configMapGenerator:
  - name: requests-performance-dashboard
    files:
      - dashboard.json=dashboards/requests-performance.json
