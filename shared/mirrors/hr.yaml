apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kts
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.kts.studio
---
apiVersion: v1
kind: Namespace
metadata:
  name: mirrors
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mirrors
  namespace: mirrors
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: mirrors
      version: '0.2.7'
      sourceRef:
        kind: HelmRepository
        name: kts
        namespace: flux-system
      interval: 10m